<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO: Titel und Kurzbeschreibung -->
  <title>Demo: Dashboard zum Ausprobieren | Auftragsassistent</title>
  <meta name="description" content="Klicken Sie sich durch die Demo: Anfragen sammeln, KI-Vorprüfung, Angebote automatisch nachfassen und alte Kunden reaktivieren – mit Beispieldaten.">
  <link rel="canonical" href="https://[Domain]/demo.html">
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Demo: Dashboard zum Ausprobieren | Auftragsassistent">
  <meta property="og:description" content="Klicken Sie sich durch die Demo mit Beispieldaten.">
  <meta property="og:url" content="https://[Domain]/demo.html">
  <meta property="og:locale" content="de_DE">

  <!-- Hell/Dunkel sofort setzen (verhindert kurzes Aufblitzen). -->
  <script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)})();</script>

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body class="app-body">
  <a class="skip-link" href="#app-main">Zum Inhalt springen</a>

  <!-- =====================================================================
       DEMO-DASHBOARD
       Alle Kunden, Anfragen und Beträge sind ERFUNDEN (Beispieldaten).
       Die Beispieldaten stehen in js/demo.js ganz oben und lassen sich dort ändern.
       Nichts wird gespeichert oder verschickt – nach dem Neuladen ist alles wie vorher.
       ===================================================================== -->

  <header class="app-top site-header">
    <a class="logo" href="index.html" aria-label="Zur Website">
      <span class="logo-mark" aria-hidden="true"></span><span data-site="name">Auftragsassistent</span>
    </a>
    <span class="demo-chip">Demo</span>
    <span class="spacer"></span>
    <button class="btn btn-outline" type="button" id="tour-start">Tour<span class="hide-sm">&nbsp;starten</span></button>
    <a class="btn btn-dark hide-sm" href="kontakt.html">Angebots-Check anfragen</a>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Dunkles Design einschalten">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="app">
    <!-- Seitenleiste (PC) -->
    <aside class="app-side" aria-label="Bereiche">
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <b>Musterbetrieb Haustechnik</b>
        Beispielbetrieb · alle Daten erfunden
        <div style="margin-top:10px"><button class="btn-mini" type="button" id="reset">Demo zurücksetzen</button></div>
      </div>
    </aside>

    <!-- Inhalt: wird von js/demo.js gefüllt -->
    <main class="app-main" id="app-main" tabindex="-1">
      <noscript><p>Für die Demo bitte JavaScript im Browser aktivieren.</p></noscript>
    </main>
  </div>

  <!-- Untere Navigation (Handy) -->
  <nav class="app-tabs" id="app-tabs" aria-label="Bereiche"></nav>

  <!-- Kurzmeldungen -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
